# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: zavastor
metadata:
  template: zavastor-dotnet-appservice@0.0.1-beta

services:
  web:
    project: .
    language: dotnet
    host: appservice
    docker:
      path: ./Dockerfile
      context: .

hooks:
  postprovision:
    windows:
      shell: pwsh
      run: |
        Write-Host "Infrastructure provisioned successfully!"
        Write-Host "Building and deploying container image..."
    posix:
      shell: sh
      run: |
        echo "Infrastructure provisioned successfully!"
        echo "Building and deploying container image..."
